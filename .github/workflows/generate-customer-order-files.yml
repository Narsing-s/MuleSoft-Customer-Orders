name: Generate Customer and Order Files

on:
  schedule:
    # GitHub Actions scheduled workflows have a 5-minute minimum.
    # Offset from minute zero to reduce congestion at the top of the hour.
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: customer-order-file-generation
  cancel-in-progress: false

jobs:
  generate-files:
    name: Generate Excel and XML
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MULE_INPUT_DIR: ${{ github.workspace }}/generated
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: generator/requirements.txt

      - name: Install generator dependency
        run: python -m pip install -r generator/requirements.txt

      - name: Generate Excel and XML files
        run: python generator/generate_all.py

      - name: Upload generated files
        uses: actions/upload-artifact@v4
        with:
          name: customer-order-files-run-${{ github.run_number }}
          path: |
            generated/customers_orders.xlsx
            generated/customers_orders.xml
          if-no-files-found: error
          retention-days: 1
