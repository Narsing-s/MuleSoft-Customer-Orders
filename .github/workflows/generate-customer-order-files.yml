name: Generate Customer and Order Files

on:
  schedule:
    # GitHub-hosted runners support scheduled workflows at 5-minute minimum intervals.
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    # Generated output commits must not trigger another generation run.
    paths-ignore:
      - "generated-files/**"

permissions:
  contents: write

concurrency:
  group: customer-order-file-generation
  cancel-in-progress: false

jobs:
  generate-files:
    name: Generate Excel and XML files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MULE_INPUT_DIR: generated-files
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install generator dependency
        run: python -m pip install -r generator/requirements.txt

      - name: Generate Excel and XML files
        run: python generator/generate_all.py

      - name: Verify generated files
        run: |
          test -s generated-files/customers_orders.xlsx
          test -s generated-files/customers_orders.xml
          python -c "import xml.etree.ElementTree as ET; ET.parse('generated-files/customers_orders.xml'); print('XML is valid')"
          file generated-files/customers_orders.xlsx generated-files/customers_orders.xml

      - name: Publish latest files for local sync
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: publish latest customer and order files"
          file_pattern: generated-files/

      - name: Upload generated Excel and XML files
        uses: actions/upload-artifact@v4
        with:
          name: customer-order-files
          path: |
            generated-files/customers_orders.xlsx
            generated-files/customers_orders.xml
          if-no-files-found: error
          retention-days: 7
