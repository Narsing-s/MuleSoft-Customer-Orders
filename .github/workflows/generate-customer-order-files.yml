name: Generate Customer and Order Files on Windows PC

on:
  schedule:
    # GitHub scheduled workflows support a 5-minute minimum interval.
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: customer-order-file-generation-local
  cancel-in-progress: false

jobs:
  generate-files:
    name: Write Excel and XML to the Windows input folder
    # Requires a registered Windows self-hosted runner on the user's PC.
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    env:
      MULE_INPUT_DIR: 'C:\Users\91938\Desktop\mulesoft file processing input data'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Python
        shell: powershell
        run: |
          python --version
          if ($LASTEXITCODE -ne 0) { throw "Python 3 is required on the Windows runner." }

      - name: Install generator dependency
        shell: powershell
        run: python -m pip install -r generator/requirements.txt

      - name: Generate Excel and XML directly in the local input folder
        shell: powershell
        run: python generator/generate_all.py

      - name: Verify generated files
        shell: powershell
        run: |
          $folder = $env:MULE_INPUT_DIR
          $xlsx = Join-Path $folder "customers_orders.xlsx"
          $xml = Join-Path $folder "customers_orders.xml"
          if (!(Test-Path $xlsx)) { throw "Excel file was not generated: $xlsx" }
          if (!(Test-Path $xml)) { throw "XML file was not generated: $xml" }
          [xml](Get-Content -Raw $xml) | Out-Null
          Get-Item $xlsx, $xml | Select-Object FullName, Length, LastWriteTime
